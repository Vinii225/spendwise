<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar transação</title>
</head>
<body>
    <h1>Editar transação</h1>

    <p th:if="${sucesso}" th:text="${sucesso}"></p>
    <p th:if="${erro}" th:text="${erro}" style="color:red"></p>

    <form th:action="@{/transacoes/{id}(id=${transacao.id})}"
          th:object="${transacaoForm}" method="post">
        <label for="data">Data</label>
        <input id="data" type="date" th:field="*{data}" required />

        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" th:field="*{descricao}" maxlength="150" required />

        <label for="valor">Valor</label>
        <input id="valor" type="number" step="0.01" th:field="*{valor}" required />

        <label for="movimento">Movimento</label>
        <select id="movimento" th:field="*{movimento}">
            <option th:each="m : ${movimentos}" th:value="${m}" th:text="${m}"></option>
        </select>

        <label for="categoriaId">Categoria</label>
        <select id="categoriaId" th:field="*{categoriaId}">
            <option th:each="categoria : ${categorias}"
                    th:value="${categoria.id}"
                    th:text="${categoria.nome}"></option>
        </select>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
