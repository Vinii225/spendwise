<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Comentário | SpendWise</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 text-slate-900"><div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-2xl px-6 py-10"><a th:href="@{/contas/{id}/extrato(id=${transacao.conta.id})}" class="text-sm font-semibold text-cyan-700">← Voltar para o extrato</a><div class="mt-5 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><p class="text-sm font-semibold text-cyan-700">Comentário</p><h1 class="mt-1 text-3xl font-bold" th:text="${comentario == null ? 'Adicionar comentário' : 'Editar comentário'}">Comentário</h1><p class="mt-2 text-slate-500" th:text="${transacao.descricao}"></p><p th:if="${erro}" th:text="${erro}" class="mt-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
<form th:if="${comentario == null}" th:action="@{/transacoes/{id}/comentario(id=${transacao.id})}" th:object="${comentarioForm}" method="post" class="mt-8"><textarea id="texto" th:field="*{texto}" required rows="6" class="w-full rounded-lg border border-slate-300 px-3 py-2.5" placeholder="Escreva um comentário"></textarea><button type="submit" class="mt-4 rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-700">Salvar comentário</button></form>
<form th:unless="${comentario == null}" th:action="@{/comentarios/{id}(id=${comentario.id})}" th:object="${comentarioForm}" method="post" class="mt-8"><textarea id="texto" th:field="*{texto}" required rows="6" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></textarea><div class="mt-4 flex flex-wrap gap-3"><button type="submit" class="rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-700">Salvar alterações</button><button type="submit" th:formaction="@{/comentarios/{id}/excluir(id=${comentario.id})}" class="rounded-lg border border-red-200 px-4 py-2.5 font-semibold text-red-700 hover:bg-red-50">Excluir comentário</button></div></form></div></main>
</body></html>
