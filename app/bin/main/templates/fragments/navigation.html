<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navigation" class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-4">
        <a th:href="@{/}" class="text-xl font-bold tracking-tight text-slate-900">SpendWise</a>
        <div class="flex flex-wrap items-center gap-2 text-sm font-medium">
            <a th:href="@{/}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Início</a>
            <a th:href="@{/contas}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Contas</a>
            <a th:if="${session.usuario != null and session.usuario.papel.name() == 'ADMINISTRADOR'}"
               th:href="@{/contas/nova}"
               class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Nova conta</a>
            <a th:if="${session.usuario != null and session.usuario.papel.name() == 'ADMINISTRADOR'}"
               th:href="@{/correntistas}"
               class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Correntistas</a>
            <a th:href="@{/auth/logout}"
               class="rounded-lg bg-slate-900 px-3 py-2 text-white hover:bg-slate-700">Sair</a>
        </div>
    </nav>
</header>
</body>
</html>
