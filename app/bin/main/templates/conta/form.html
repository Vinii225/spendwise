<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova conta | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-2xl px-6 py-10"><div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><p class="text-sm font-semibold text-cyan-700">Administração</p><h1 class="mt-1 text-3xl font-bold">Nova conta</h1><p class="mt-2 text-slate-500">Associe uma conta a um correntista.</p>
    <p th:if="${sucesso}" th:text="${sucesso}" class="mt-5 rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-700"></p><p th:if="${erro}" th:text="${erro}" class="mt-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    <form th:action="@{/contas}" th:object="${contaForm}" method="post" class="mt-8 space-y-5">
        <div><label for="correntistaId" class="mb-1 block text-sm font-medium">Correntista</label><select id="correntistaId" th:field="*{correntistaId}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"><option th:each="c : ${correntistas}" th:value="${c.id}" th:text="${c.nome}"></option></select></div>
        <div><label for="numero" class="mb-1 block text-sm font-medium">Número</label><input id="numero" type="text" th:field="*{numero}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <div><label for="descricao" class="mb-1 block text-sm font-medium">Descrição</label><input id="descricao" type="text" th:field="*{descricao}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <div><label for="tipo" class="mb-1 block text-sm font-medium">Tipo</label><select id="tipo" th:field="*{tipo}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"><option th:each="t:${tipos}" th:value="${t}" th:text="${t}"></option></select></div>
        <div><label for="diaFechamento" class="mb-1 block text-sm font-medium">Dia de fechamento <span class="font-normal text-slate-500">(somente cartão)</span></label><input id="diaFechamento" type="number" th:field="*{diaFechamento}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <button type="submit" class="rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-700">Salvar conta</button>
    </form>
</div></main>
</body>
</html>
