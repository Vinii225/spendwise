<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-900 px-6 text-slate-900">
<main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <p class="text-sm font-semibold uppercase tracking-widest text-cyan-700">SpendWise</p>
    <h1 class="mt-2 text-3xl font-bold">Criar conta</h1>
    <p class="mt-2 text-sm text-slate-500">Cadastre seu acesso como correntista.</p>
    <p th:if="${erro}" th:text="${erro}" class="mt-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    <form th:action="@{/cadastro}" th:object="${correntistaForm}" method="post" class="mt-6 space-y-5">
        <div><label for="nome" class="mb-1 block text-sm font-medium">Nome</label><input id="nome" type="text" th:field="*{nome}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <div><label for="login" class="mb-1 block text-sm font-medium">Login</label><input id="login" type="text" th:field="*{login}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <div><label for="senha" class="mb-1 block text-sm font-medium">Senha</label><input id="senha" type="password" th:field="*{senha}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
        <button type="submit" class="w-full rounded-lg bg-cyan-600 px-4 py-3 font-semibold text-white hover:bg-cyan-700">Criar cadastro</button>
    </form>
    <p class="mt-6 text-center text-sm"><a th:href="@{/auth}" class="font-semibold text-cyan-700">Voltar para login</a></p>
</main>
</body>
</html>
