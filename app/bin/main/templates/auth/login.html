<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar | SpendWise</title>
        <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-900 px-6 text-slate-900">
<main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
        <p class="text-sm font-semibold uppercase tracking-widest text-cyan-700">SpendWise</p>
        <h1 class="mt-2 text-3xl font-bold">Entrar</h1>
        <p class="mt-2 text-sm text-slate-500">Acesse suas contas e extratos.</p>
        <p th:if="${erro}" th:text="${erro}" class="mt-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>

        <form th:action="@{/auth}" th:object="${loginForm}" method="post" class="mt-6 space-y-5">
                <div>
                        <label for="login" class="mb-1 block text-sm font-medium text-slate-700">Login</label>
                        <input id="login" type="text" th:field="*{login}" required
                                   class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100">
                </div>
                <div>
                        <label for="senha" class="mb-1 block text-sm font-medium text-slate-700">Senha</label>
                        <input id="senha" type="password" th:field="*{senha}" required
                                   class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100">
                </div>
                <button type="submit" class="w-full rounded-lg bg-cyan-600 px-4 py-3 font-semibold text-white hover:bg-cyan-700">Entrar</button>
        </form>
</main>
</body>
</html>
