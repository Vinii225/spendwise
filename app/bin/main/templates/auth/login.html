<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - SpendWise</title>
</head>

<body>

<h1>Login</h1>

<p th:if="${erro}"
   th:text="${erro}"
   style="color: red">
</p>

<form th:action="@{/auth}"
      th:object="${loginForm}"
      method="post">

    <label for="login">Login</label>
    <input
            id="login"
            type="text"
            th:field="*{login}"
    />

    <br><br>

    <label for="senha">Senha</label>
    <input
            id="senha"
            type="password"
            th:field="*{senha}"
    />

    <br><br>

    <button type="submit">Entrar</button>

</form>

</body>
</html>
