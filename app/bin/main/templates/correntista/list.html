<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correntistas | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-6xl px-6 py-10">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="text-sm font-semibold text-cyan-700">Administração</p><h1 class="mt-1 text-3xl font-bold">Correntistas</h1></div>
        <a th:href="@{/correntistas/nova}" class="rounded-lg bg-cyan-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-cyan-700">Novo correntista</a>
    </div>
    <div th:if="${correntistas.isEmpty()}" class="mt-8 rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center"><p class="text-lg font-semibold">Nenhum correntista cadastrado</p></div>
    <div th:unless="${correntistas.isEmpty()}" class="mt-8 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <thead class="bg-slate-100 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-3">Nome</th><th class="px-5 py-3">Login</th><th class="px-5 py-3">Papel</th><th class="px-5 py-3">Status</th></tr></thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="correntista : ${correntistas.content}" class="hover:bg-slate-50"><td class="px-5 py-4 font-medium" th:text="${correntista.nome}"></td><td class="px-5 py-4 text-slate-600" th:text="${correntista.login}"></td><td class="px-5 py-4 text-slate-600" th:text="${correntista.papel}"></td><td class="px-5 py-4 text-slate-600" th:text="${correntista.bloqueado ? 'Bloqueado' : 'Ativo'}"></td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${correntistas.totalPages > 1}" class="mt-6 flex flex-wrap items-center justify-center gap-2" aria-label="Paginação de correntistas">
        <a th:if="${correntistas.hasPrevious()}" th:href="@{/correntistas(page=${correntistas.number - 1},size=${correntistas.size})}" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white">Anterior</a>
        <span th:each="numero : ${#numbers.sequence(0, correntistas.totalPages - 1)}"><a th:href="@{/correntistas(page=${numero},size=${correntistas.size})}" th:text="${numero + 1}" th:class="${numero == correntistas.number ? 'rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white' : 'rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white'}"></a></span>
        <a th:if="${correntistas.hasNext()}" th:href="@{/correntistas(page=${correntistas.number + 1},size=${correntistas.size})}" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white">Próxima</a>
    </nav>
</main>
</body>
</html>
