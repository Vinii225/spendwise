<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Correntistas</title>
</head>

<body>

<h1>Lista de Correntistas</h1>

<a th:href="@{/correntistas/nova}">
    Cadastrar novo correntista
</a>

<br><br>

<table>
    <thead>
    <tr>
        <th>Nome</th>
        <th>Login</th>
        <th>Papel</th>
        <th>Bloqueado</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="correntista : ${correntistas}">
        <td th:text="${correntista.nome}"></td>
        <td th:text="${correntista.login}"></td>
        <td th:text="${correntista.papel}"></td>
        <td th:text="${correntista.bloqueado}"></td>
    </tr>

    </tbody>
</table>

</body>
</html>
