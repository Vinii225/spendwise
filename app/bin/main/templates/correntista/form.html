<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Novo correntista | SpendWise</title>
        <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-2xl px-6 py-10">
        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
                <p class="text-sm font-semibold text-cyan-700">Administração</p><h1 class="mt-1 text-3xl font-bold">Novo correntista</h1>
                <form th:action="@{/correntistas}" th:object="${correntistaForm}" method="post" class="mt-8 space-y-5">
                        <div><label for="nome" class="mb-1 block text-sm font-medium">Nome</label><input id="nome" type="text" th:field="*{nome}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100"></div>
                        <div><label for="login" class="mb-1 block text-sm font-medium">Login</label><input id="login" type="text" th:field="*{login}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100"></div>
                        <div><label for="senha" class="mb-1 block text-sm font-medium">Senha</label><input id="senha" type="password" th:field="*{senha}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100"></div>
                        <div class="flex flex-wrap gap-3 pt-2"><button type="submit" class="rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-700">Salvar correntista</button><a th:href="@{/correntistas}" class="rounded-lg border border-slate-300 px-4 py-2.5 font-semibold text-slate-700 hover:bg-slate-50">Cancelar</a></div>
                </form>
        </div>
</main>
</body>
</html>
