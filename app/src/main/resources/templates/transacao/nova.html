<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova transação | SpendWise</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-2xl px-6 py-10">
    <a th:href="@{/contas/{id}/extrato(id=${conta.id})}" class="text-sm font-semibold text-cyan-700">← Voltar para o extrato</a>
    <div class="mt-5 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><p class="text-sm font-semibold text-cyan-700">Lançamento</p><h1 class="mt-1 text-3xl font-bold">Nova transação</h1><p class="mt-2 text-slate-500" th:text="|Conta: ${conta.descricao}|">Conta</p>
        <p th:if="${erro}" th:text="${erro}" class="mt-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
        <form th:action="@{/transacoes}" th:object="${transacaoForm}" method="post" class="mt-8 space-y-5">
            <input type="hidden" name="contaId" th:value="${conta.id}">
            <div><label for="data" class="mb-1 block text-sm font-medium">Data</label><input id="data" type="text" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" th:field="*{data}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
            <div><label for="descricao" class="mb-1 block text-sm font-medium">Descrição</label><input id="descricao" type="text" th:field="*{descricao}" maxlength="150" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
            <div><label for="valor" class="mb-1 block text-sm font-medium">Valor</label><input id="valor" type="number" step="0.01" th:field="*{valor}" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></div>
            <div><label for="movimento" class="mb-1 block text-sm font-medium">Movimento</label><select id="movimento" th:field="*{movimento}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"><option th:each="m : ${movimentos}" th:value="${m}" th:text="${m}"></option></select></div>
            <div><label for="categoriaId" class="mb-1 block text-sm font-medium">Categoria</label><select id="categoriaId" th:field="*{categoriaId}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5"><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}"></option></select></div>
            <button type="submit" class="rounded-lg bg-cyan-600 px-4 py-2.5 font-semibold text-white hover:bg-cyan-700">Salvar transação</button>
        </form>
    </div>
</main>
</body>
</html>
