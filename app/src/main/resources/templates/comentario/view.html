<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentário | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
    <main class="mx-auto max-w-2xl px-6 py-10">
        <a th:href="@{/contas/{id}/extrato(id=${comentario.transacao.conta.id})}" class="text-sm font-semibold text-cyan-700">← Voltar para o extrato</a>
        <article class="mt-5 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><p class="text-sm font-semibold text-cyan-700">Comentário da transação</p><p class="mt-4 whitespace-pre-wrap leading-7 text-slate-700" th:text="${comentario.texto}"></p></article>
    </main>
</body>
</html>
