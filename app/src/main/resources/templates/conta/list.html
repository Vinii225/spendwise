<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas | SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-6xl px-6 py-10">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="text-sm font-semibold text-cyan-700">Visão financeira</p><h1 class="mt-1 text-3xl font-bold">Contas</h1><p class="mt-2 text-slate-500">Escolha uma conta para consultar o extrato.</p></div>
        <a th:href="@{/contas/nova}" class="rounded-lg bg-cyan-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-cyan-700">Nova conta</a>
    </div>
    <div th:if="${contas.isEmpty()}" class="mt-8 rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center"><p class="text-lg font-semibold">Nenhuma conta cadastrada</p><p class="mt-2 text-sm text-slate-500">Cadastre uma conta para começar.</p><a th:href="@{/contas/nova}" class="mt-5 inline-block rounded-lg bg-cyan-600 px-4 py-2.5 text-center text-sm font-semibold text-white hover:bg-cyan-700">Cadastrar primeira conta</a></div>
    <div th:unless="${contas.isEmpty()}" class="mt-8 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <article th:each="conta : ${contas.content}" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-wide text-slate-400" th:text="${conta.tipo}"></p><h2 class="mt-2 text-xl font-bold" th:text="${conta.descricao}"></h2></div><span class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-semibold text-cyan-700" th:text="${conta.numero}"></span></div><a th:href="@{/contas/{id}/extrato(id=${conta.id})}" class="mt-6 block rounded-lg bg-slate-900 px-4 py-2.5 text-center text-sm font-semibold text-white hover:bg-slate-700">Abrir extrato</a></article>
    </div>
    <nav th:if="${contas.totalPages > 1}" class="mt-6 flex flex-wrap items-center justify-center gap-2" aria-label="Paginação de contas">
        <a th:if="${contas.hasPrevious()}" th:href="@{/contas(page=${contas.number - 1},size=${contas.size})}" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white">Anterior</a>
        <span th:each="numero : ${#numbers.sequence(0, contas.totalPages - 1)}"><a th:href="@{/contas(page=${numero},size=${contas.size})}" th:text="${numero + 1}" th:class="${numero == contas.number ? 'rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white' : 'rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white'}"></a></span>
        <a th:if="${contas.hasNext()}" th:href="@{/contas(page=${contas.number + 1},size=${contas.size})}" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-white">Próxima</a>
    </nav>
</main>
</body>
</html>
